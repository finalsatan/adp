[project]
name = "adp-parser"
version = "0.1.0"
description = "智能体开发平台的解析服务"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "boto3>=1.34",
    "docling-core==2.103.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "charset-normalizer>=3.3",
    "pypdfium2>=5.14.0",
    "filetype==1.2.0",
    "olefile==0.47",
    "unoserver==3.7",
    "docling==2.142.1",
    # RapidOCR 的 CPU 推理后端（X06）：镜像里预置的 OCR 模型是 onnx 格式
    "onnxruntime>=1.20",
    "markitdown[docx,pptx]==0.1.9",
    "httpx>=0.27",
    # X11：torch、torchvision 只作为直接依赖写在这里，uv 才会对它们应用 [tool.uv.sources]（间接依赖不生效）。
    # 版本由 docling-ibm-models 的约束决定，这里不额外限版本。
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "moto[s3]>=5",
    "reportlab>=5.1.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

# X11：Docling 在 CPU 上跑，torch 走 PyTorch 官方 CPU 索引，镜像里不再装 CUDA 依赖（约 3GB）。
# 索引标成 explicit，只有 [tool.uv.sources] 里点名它的包才用它；macOS 本机继续用 PyPI 的轮子（本来不带 CUDA）。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: 需要本地开发容器（RustFS 或 mineru，见 make parser-dev-up）",
    "libreoffice: 需要镜像内的 LibreOffice、unoserver 和中文字体",
]
addopts = "-m 'not integration and not libreoffice'"
