[project]
name = "adp-backend"
version = "0.1.0"
description = "智能体开发平台主服务"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3==1.43.111",
    "celery[redis]==5.6.3",
    "cryptography>=44.0.0",
    "docling-core==2.103.1",
    "fastapi>=0.159.1",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain-text-splitters>=1.1.3",
    "litellm==1.104.2",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.20",
    "redis>=5",
    "sqlalchemy[asyncio]>=2,<3",
    "tiktoken==0.14.0",
    "tree-sitter>=0.25,<0.27",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
