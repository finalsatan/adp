# 生产部署：单机 Docker Compose（技术方案 12）。
# 独立项目名，避免和 deploy/docker-compose.dev.yml 的容器、数据卷冲突。
name: adp-prod

services:
  postgres:
    image: paradedb/paradedb:0.26.2-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      # 初始化脚本读取：建两个角色和 adp 库
      ADP_MIGRATOR_PASSWORD: ${ADP_MIGRATOR_PASSWORD:?}
      ADP_APP_PASSWORD: ${ADP_APP_PASSWORD:?}
      ADP_DATABASES: adp
    volumes:
      - adp_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4.11
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 一次性执行表结构迁移后退出；api 等它成功完成再启动（技术方案 12）
  migrate:
    image: adp-backend:0.1.0
    command: ["alembic", "upgrade", "head"]
    # 迁移命令会构造完整 Settings（需要 DATABASE_URL / REDIS_URL / JWT_SECRET），
    # 所以这里整份读 .env；其中 MIGRATION_DATABASE_URL 只给本服务，api 不注入。
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-prod}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: adp-backend:0.1.0
    build:
      context: ../backend
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: ${REDIS_URL:?}
      JWT_SECRET: ${JWT_SECRET:?}
      # 模型密钥的加密主密钥（P2-02）；丢失后已存密钥无法解密
      MASTER_KEY: ${MASTER_KEY:?}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # 第二期访问云模型供应商用；不用时留空
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      # LiteLLM 不在启动时联网拉取模型价格表（代码里已默认设置，这里显式传入）
      LITELLM_LOCAL_MODEL_COST_MAP: ${LITELLM_LOCAL_MODEL_COST_MAP:-True}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: adp-nginx:0.1.0
    build:
      context: ../frontend
      dockerfile: ../deploy/nginx/Dockerfile
      # nginx 配置从 deploy/nginx/ 传入（见 deploy/nginx/Dockerfile）
      additional_contexts:
        nginx_conf: ./nginx
    ports:
      # 宿主机端口可配置，默认 80 / 443
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  adp_pgdata:
