# 生产 nginx：终止 HTTPS、托管前端静态文件、把 /api/ 转发到 api:8000。
# 这里的 80/443 是容器内端口；宿主机映射端口在 deploy/docker-compose.yml（HTTP_PORT / HTTPS_PORT）。

# 客户前面还有负载均衡时，只信任该负载均衡的地址（否则伪造 X-Forwarded-For 就能改来源 IP）：
#   1. 打开下面几行，把 10.0.0.0/8 换成负载均衡的地址或网段；
#   2. nginx 需要 --with-http_realip_module（官方镜像已带）。
# 默认不开启，来源 IP 一律取 $remote_addr。
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

# 80 只做跳转到 443
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（补充）；用 always 让错误响应也带上。
    # 注意：某个 location 里再写 add_header 会覆盖这里的设置，所以缓存用 expires 控制。
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # 健康检查只在容器网络内使用，不对外暴露
    location = /healthz {
        return 404;
    }
    location = /readyz {
        return 404;
    }

    # 带哈希的静态资源长缓存
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后能拿到新资源
    location = /index.html {
        expires -1;
    }

    # 前端路由：找不到文件时回退到 index.html
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖客户端传来的 X-Real-IP：登录锁定按 IP 计，不能信任请求头（技术方案 8.1）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        # 不转发客户端传来的 X-Forwarded-For
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;

        # 上传：单文件上限默认 200MB，这里留 2 倍以上余量；关闭请求体缓冲以流式上传
        # （知识库技术方案 18）。
        client_max_body_size 512m;
        proxy_request_buffering off;
        # 原文读取接口透传 HTTP Range
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # SSE（第二期 P2-07）：后端响应带 X-Accel-Buffering: no，nginx 默认据此关闭缓冲，
        # 效果等同 proxy_buffering off。这里不能配置 proxy_ignore_headers X-Accel-Buffering，
        # 否则以后新增 SSE 接口都要改 nginx（技术方案 9.6）。
    }
}
